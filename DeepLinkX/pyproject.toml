[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deeplinkx"
version = "1.0.0"
description = "Android deep link and entry-point security auditor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Karndeep Baror" }]
keywords = ["android", "security", "deep-link", "apk", "pentest", "static-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "cryptography>=41",
    "reportlab>=4.0",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deeplinkx = "deeplinkx.cli.main:main"

[project.urls]
Homepage = "https://github.com/karndeepbaror/deeplinkx"
Source = "https://github.com/karndeepbaror/deeplinkx"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deeplinkx = ["profiles/*.yaml", "rules/*.yaml", "reports/templates/*.j2", "web/*", "web/css/*", "web/js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
