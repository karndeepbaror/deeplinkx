services:
  deeplinkx:
    build: .
    image: deeplinkx:1.0.0
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # Required because the server listens on 0.0.0.0 inside the container. Set your own secret.
      DEEPLINKX_API_TOKEN: "${DEEPLINKX_API_TOKEN:?set DEEPLINKX_API_TOKEN}"
      DEEPLINKX_MAX_UPLOAD_MB: "300"
    volumes:
      - dlx-data:/data
      - ./apks:/work/apks:ro
      - ./reports:/work/reports
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  dlx-data:
